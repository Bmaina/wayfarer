<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Five agents run in sequence on top of a deterministic engine, then a human approves">
<style>.n{font:600 13px Segoe UI,Helvetica,Arial,sans-serif;fill:#E6F0EF}.num{font:700 12px Segoe UI,sans-serif;fill:#93b0ae}.h{font:700 15px Segoe UI,sans-serif;fill:#E6F0EF}.sm{font:400 12px Segoe UI,sans-serif;fill:#93b0ae}</style>
<rect width="1000" height="300" rx="16" fill="#0B1B20"/>
<text x="40" y="34" class="h">One brief in. Five agents. A person approves.</text>
<line x1="150" y1="90" x2="240" y2="90" stroke="#4FB8C4" stroke-width="2" stroke-dasharray="5 5"/><line x1="320" y1="90" x2="410" y2="90" stroke="#4FB8C4" stroke-width="2" stroke-dasharray="5 5"/><line x1="490" y1="90" x2="580" y2="90" stroke="#4FB8C4" stroke-width="2" stroke-dasharray="5 5"/><line x1="660" y1="90" x2="750" y2="90" stroke="#4FB8C4" stroke-width="2" stroke-dasharray="5 5"/><g><circle cx="110" cy="90" r="38" fill="#12292F" stroke="#4FB8C4" stroke-width="2.5"><animate attributeName="fill" values="#12292F;#F0B323;#12292F;#12292F" keyTimes="0;0.08;0.2;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle><text x="110" y="94" text-anchor="middle" class="n">Intent</text><text x="110" y="144" text-anchor="middle" class="num">1</text></g><g><circle cx="280" cy="90" r="38" fill="#12292F" stroke="#4FB8C4" stroke-width="2.5"><animate attributeName="fill" values="#12292F;#F0B323;#12292F;#12292F" keyTimes="0;0.08;0.2;1" dur="10s" begin="1.6s" repeatCount="indefinite"/></circle><text x="280" y="94" text-anchor="middle" class="n">Discovery</text><text x="280" y="144" text-anchor="middle" class="num">2</text></g><g><circle cx="450" cy="90" r="38" fill="#12292F" stroke="#4FB8C4" stroke-width="2.5"><animate attributeName="fill" values="#12292F;#F0B323;#12292F;#12292F" keyTimes="0;0.08;0.2;1" dur="10s" begin="3.2s" repeatCount="indefinite"/></circle><text x="450" y="86" text-anchor="middle" class="n">Journey</text><text x="450" y="100" text-anchor="middle" class="n">builder</text><text x="450" y="144" text-anchor="middle" class="num">3</text></g><g><circle cx="620" cy="90" r="38" fill="#12292F" stroke="#4FB8C4" stroke-width="2.5"><animate attributeName="fill" values="#12292F;#F0B323;#12292F;#12292F" keyTimes="0;0.08;0.2;1" dur="10s" begin="4.800000000000001s" repeatCount="indefinite"/></circle><text x="620" y="94" text-anchor="middle" class="n">Verifier</text><text x="620" y="144" text-anchor="middle" class="num">4</text></g><g><circle cx="790" cy="90" r="38" fill="#12292F" stroke="#4FB8C4" stroke-width="2.5"><animate attributeName="fill" values="#12292F;#F0B323;#12292F;#12292F" keyTimes="0;0.08;0.2;1" dur="10s" begin="6.4s" repeatCount="indefinite"/></circle><text x="790" y="86" text-anchor="middle" class="n">Booking</text><text x="790" y="100" text-anchor="middle" class="n">coordinator</text><text x="790" y="144" text-anchor="middle" class="num">5</text></g>
<circle r="6" fill="#F0B323"><animateMotion dur="10s" repeatCount="indefinite" path="M110 90 L790 90"/></circle>
<line x1="830" y1="90" x2="885" y2="90" stroke="#4FB8C4" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="885" y="58" width="95" height="64" rx="12" fill="#1d7a4b"/><text x="932" y="86" text-anchor="middle" class="n" style="fill:#fff">Human</text><text x="932" y="102" text-anchor="middle" class="n" style="fill:#fff">approval</text>
<rect x="60" y="190" width="860" height="70" rx="12" fill="#12292F" stroke="#F0B323" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="490" y="218" text-anchor="middle" class="h">Deterministic engine: prices, scores and checks</text>
<text x="490" y="240" text-anchor="middle" class="sm">Every number comes from tested code. Models choose and explain. They never produce a price.</text></svg>